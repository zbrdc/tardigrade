[package]
name = "v8vm"
version = "0.1.0"
edition = "2021"
autobins = true
autoexamples = false

[dependencies]
v8 = "0.106.0"
serde_json = "1"

# Sandbox layers. x86_64-Linux only (the deny list and the x32 guard are
# verified on that ABI) and pinned exactly: the syscall constants and crate
# APIs they were reviewed against come from these versions.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "=0.2.190"

# Test-only: exposes per-layer sandbox application so the tests can attribute
# a denial to a single layer. Never enabled for production builds.
[features]
test-layers = []

[dev-dependencies]
v8vm = { path = ".", features = ["test-layers"] }

[profile.release]
opt-level = 2
debug = false

[profile.dev]
debug = 0

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "library"
path = "tests/library.rs"

# A plain main() (no libtest harness): the stdin hub test re-execs itself
# in a child mode to drive the child's real stdin pipe.
[[test]]
name = "stdin_hub"
path = "tests/stdin_hub.rs"
harness = false

# A plain main() (no libtest harness): sandbox::apply refuses to run once any
# thread exists and libtest always runs tests on a worker thread, so the
# probes re-exec this binary as a single-threaded child instead.
[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
harness = false
