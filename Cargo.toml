[package]
name = "v8vm"
version = "0.1.0"
edition = "2021"
autobins = true
autoexamples = false

[dependencies]
v8 = "0.106.0"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "0.2"

[profile.release]
opt-level = 2
debug = false

[profile.dev]
debug = 0
