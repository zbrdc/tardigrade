# CI for tardigrade. The v8 crate downloads a prebuilt static V8 into
# target/release/gn_out on its first build, so the first uncached run is
# slow. The workflow caches that directory explicitly with cache-directories
# on Swatinem/rust-cache, because rust-cache's target cleanup would otherwise
# drop it. Verify on the second CI run that the download is skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_sandbox:
        description: "Fail if the runner kernel cannot sandbox (Landlock ABI 6)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Third-party actions are pinned by commit SHA (Dependabot keeps
      # them current); a moving tag or branch must never execute here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain action: rustup is preinstalled on the runner image,
      # and installing the pinned toolchain directly removes one
      # unpinned third-party action (this used dtolnay/rust-toolchain@master).
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install 1.98.0 --component clippy --profile minimal
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-directories: target/release/gn_out
      - name: Test, clippy and smoke checks
        # make ci = cargo test, cargo clippy (warnings denied), then make check
        # (build + scripted checks that drive the example programs end to end).
        # CARGOFLAGS=--locked uses the committed Cargo.lock.
        #
        # --sandbox needs Landlock ABI 6 (Linux 6.12). Hosted runners may run
        # an older kernel, so the sandbox runtime tests and the make check
        # sandbox line report a skip and pass there, gated on the kernel's
        # actual Landlock ABI (tardigrade --sandbox-check), never on a refusal
        # message: a kernel that can sandbox but refuses fails the gate.
        # Dispatch this workflow with require_sandbox=true on a runner
        # known to have the support to turn that skip into a failure, so a
        # silent skip cannot hide a regression.
        env:
          TARDIGRADE_REQUIRE_SANDBOX: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_sandbox) && '1' || '' }}
        run: make ci CARGOFLAGS=--locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
