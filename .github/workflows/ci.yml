# CI for v8vm. The v8 crate downloads a prebuilt static V8 into
# target/release/gn_out on its first build, so the first uncached run is
# slow. The workflow caches that directory explicitly with cache-directories
# on Swatinem/rust-cache, because rust-cache's target cleanup would otherwise
# drop it. Verify on the second CI run that the download is skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-directories: target/release/gn_out
      - name: Test, clippy and smoke checks
        # make ci = cargo test, cargo clippy (warnings denied), then make check
        # (build + scripted checks that drive the example programs end to end).
        # CARGOFLAGS=--locked uses the committed Cargo.lock.
        #
        # --sandbox needs Landlock ABI 6 (Linux 6.12). Hosted runners may run
        # an older kernel, so the sandbox runtime tests and the make check
        # sandbox line report a skip and pass there, gated on the kernel's
        # actual Landlock ABI (v8vm --sandbox-check), never on a refusal
        # message: a kernel that can sandbox but refuses fails the gate.
        # V8VM_REQUIRE_SANDBOX=1 would make a missing kernel feature fail
        # instead; set it in this step's env only on a runner known to have
        # the support, so a silent skip cannot hide a regression. It is
        # deliberately unset here.
        run: make ci CARGOFLAGS=--locked
