# CI for v8vm. The v8 crate downloads a prebuilt static V8 library on the
# first build (into the target directory, under release/gn_out/), so the
# first uncached run is slow; Swatinem/rust-cache caches target/ and the
# cargo registry between runs, which includes that archive.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Test, clippy and smoke checks
        # make ci = cargo test, cargo clippy (warnings denied), then make check
        # (build + scripted checks that drive the example programs end to end).
        # CARGOFLAGS=--locked uses the committed Cargo.lock.
        run: make ci CARGOFLAGS=--locked
